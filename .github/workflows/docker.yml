# Builds and publishes the MCP server image (see Dockerfile) to Docker Hub
# as ndeloof/garmin_mcp, for linux/amd64 and linux/arm64.
#
# Requires the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets
# (a Docker Hub access token with write access to the ndeloof namespace).
name: Docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - go.mod
      - go.sum
      - "cmd/**"
      - "pkg/**"
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    if: github.repository == 'ndeloof/go-garmin'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ndeloof/garmin_mcp:latest
